<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request a Session | Peer Tutoring Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="container navbar navbar-expand-sm" aria-label="Main navigation">
            <a class="navbar-brand" href="index.html">Peer Tutoring Hub</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="tutors.html">Tutors</a>
                <a class="nav-link active" aria-current="page" href="request-form.html">Request a session</a>
            </div>
        </nav>
    </header>
    <main class="container page-content">
        <div class="form-layout">
            <h1>Request a tutoring session</h1>
            <p class="page-intro">Choose the course and date that work best for you.</p>
            <form action="process-request.php" method="post">
                <div class="mb-3">
                    <label class="form-label" for="course">Course</label>
                    <input class="form-control" id="course" name="course" type="text" placeholder="IS ****" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="date">Preferred Date</label>
                    <input class="form-control" id="date" name="date" type="date" required>
                </div>
                <button class="btn btn-primary" type="submit">Request Session</button>
            </form>
        </div>
    </main>
</body>
</html>
